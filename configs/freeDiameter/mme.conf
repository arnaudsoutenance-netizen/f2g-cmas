# FreeDiameter Configuration for MME - Minimal config
Identity = "mme.epc.mnc001.mcc001.3gppnetwork.org";
Realm = "epc.mnc001.mcc001.3gppnetwork.org";

# TLS Configuration  
TLS_Cred = "/etc/freeDiameter/mme.cert.pem", "/etc/freeDiameter/mme.key.pem";
TLS_CA = "/etc/freeDiameter/cacert.pem";

# Use TCP instead of SCTP
Prefer_TCP;
No_SCTP;

# Listen address
ListenOn = "172.22.0.9";

# Connect to HSS without TLS
ConnectPeer = "hss.epc.mnc001.mcc001.3gppnetwork.org" { 
    ConnectTo = "172.22.0.8"; 
    No_TLS;
};
