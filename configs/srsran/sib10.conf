#####################################################################
# SIB10 Configuration - ETWS Primary Notification
# F2G TelcoLab - PKF Telco Academy
#
# ETWS (Earthquake and Tsunami Warning System)
# Primary notification for immediate warning
#
# Message IDs (3GPP TS 23.041):
#   0x1100 = Earthquake
#   0x1101 = Tsunami
#   0x1102 = Earthquake + Tsunami
#   0x1103 = Test
#   0x1104 = Other
#
# Warning Type (2 bytes):
#   Bit 9-0: Warning Type value
#   Bit 10:  Emergency User Alert (1=activate)
#   Bit 11:  Popup (1=display popup)
#####################################################################

sib10 =
{
    # Message Identifier (16-bit)
    # 0x1100 = 4352 = Earthquake warning
    message_id = 0x1100;
    
    # Serial Number (16-bit) - unique per message
    serial_num = 0x0001;
    
    # Warning Type (16-bit)
    # 0x0880 = Earthquake + Emergency Alert + Popup
    warning_type = 0x0880;
};
