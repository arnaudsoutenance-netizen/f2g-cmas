#####################################################################
# srsENB Configuration WITHOUT Alerts
# Use this to attach phones, then switch to enb_pws.conf to send alert
# F2G TelcoLab
#####################################################################

[enb]
enb_id = 0x19B
mcc = 001
mnc = 01
mme_addr = 172.22.0.9
gtp_bind_addr = 172.22.0.1
s1c_bind_addr = 172.22.0.1
n_prb = 50
nof_ports = 1

[enb_files]
sib_config = /home/f2g/Telecom/Core-Network/docker_open5gs/srsran/sib_no_alert.conf
rr_config = /etc/srsran/rr.conf
rb_config = /etc/srsran/rb.conf

[rf]
dl_earfcn = 1450
tx_gain = 60
rx_gain = 40
device_name = bladeRF

[pcap]
enable = false
filename = /tmp/enb.pcap

[log]
all_level = info
all_hex_limit = 32
filename = /tmp/enb_no_alert.log

[expert]
pusch_max_its = 8
nof_phy_threads = 3
metrics_period_secs = 1
tx_amplitude = 0.6
rrc_inactivity_timer = 30000
