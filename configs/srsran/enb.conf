#####################################################################
#                   srsENB configuration file
#                   F2G TelcoLab - Open5GS + bladeRF xA4
#####################################################################

[enb]
enb_id = 0x19B
mcc = 001
mnc = 01
mme_addr = 172.22.0.9
# IMPORTANT: Utiliser l'IP du bridge Docker (accessible depuis l'hôte ET les conteneurs)
gtp_bind_addr = 172.22.0.1
s1c_bind_addr = 172.22.0.1
n_prb = 50
nof_ports = 1

[enb_files]
sib_config = /etc/srsran/sib.conf
rr_config  = /etc/srsran/rr.conf
rb_config  = /etc/srsran/rb.conf

[rf]
dl_earfcn = 1450
tx_gain = 60
rx_gain = 40
device_name = bladeRF

[pcap]
enable = false
filename = /tmp/enb.pcap
s1ap_enable = false
s1ap_filename = /tmp/enb_s1ap.pcap

[log]
all_level = info
all_hex_limit = 32
filename = /tmp/enb.log
file_max_size = -1

[expert]
pusch_max_its = 8
nof_phy_threads = 3
metrics_period_secs = 1
metrics_csv_enable = false
pregenerate_signals = false
tx_amplitude = 0.6
rrc_inactivity_timer = 30000
print_buffer_state = false
