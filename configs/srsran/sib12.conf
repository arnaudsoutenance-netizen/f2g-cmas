#####################################################################
# SIB12 Configuration - CMAS Warning Notification
# F2G TelcoLab - PKF Telco Academy
#
# CMAS (Commercial Mobile Alert System) - US/International
#
# Message IDs (3GPP TS 23.041, Annex B):
#   4370 (0x1112) = Presidential Alert
#   4371-4372     = Extreme Alert (Imminent threat to life)
#   4373-4378     = Severe Alert
#   4379          = AMBER Alert (child abduction)
#   4380          = RMT (Required Monthly Test)
#   4381          = Exercise
#   4382          = Operator defined
#   4383-4391     = Public Safety
#   4392          = State/Local Test
#
# Data Coding Scheme:
#   0x01 = GSM-7 default alphabet
#   0x48 = UCS-2 (Unicode)
#####################################################################

sib12 =
{
    # Message Identifier
    # 4380 = 0x111C = Required Monthly Test
    message_id = 0x111C;
    
    # Serial Number
    serial_num = 0x0001;
    
    # Data Coding Scheme (GSM-7)
    data_coding_scheme = 0x01;
    
    # Warning message text
    warning_message = "CMAS TEST - F2G TelcoLab. This is a test of the Commercial Mobile Alert System. No action required.";
};
