#####################################################################
# eNB2 Configuration - TAC 2 - Zone Douala - CMAS ACTIVÉ
# F2G Multi-Zone CMAS Demo
#####################################################################

[enb]
enb_id = 0x19C
mcc = 001
mnc = 01
mme_addr = 192.168.1.100          # IP PC1 (interface Ethernet)
gtp_bind_addr = 192.168.1.101     # IP PC2 (interface Ethernet)
s1c_bind_addr = 192.168.1.101     # IP PC2 (interface Ethernet)
n_prb = 50
nof_ports = 1

[enb_files]
sib_config = /home/f2g/srsran/sib_tac2_cmas.conf
rr_config = /etc/srsran/rr.conf
rb_config = /etc/srsran/rb.conf

[rf]
dl_earfcn = 1575
tx_gain = 60
rx_gain = 40
device_name = bladeRF

[pcap]
enable = false
filename = /tmp/enb_tac2.pcap

[log]
all_level = info
all_hex_limit = 32
filename = /tmp/enb_tac2.log

[expert]
pusch_max_its = 8
nof_phy_threads = 3
metrics_period_secs = 1
tx_amplitude = 0.6
rrc_inactivity_timer = 30000
