#####################################################################
# SIB11 Configuration - ETWS Secondary Notification
# F2G TelcoLab - PKF Telco Academy
#
# Contains the detailed warning message text
#
# Data Coding Scheme (8-bit, TS 23.038):
#   0x00 = GSM 7-bit default alphabet (English)
#   0x01 = GSM 7-bit default alphabet
#   0x48 = UCS-2 (Unicode)
#####################################################################

sib11 =
{
    # Message Identifier (must match SIB10)
    message_id = 0x1100;
    
    # Serial Number (must match SIB10)
    serial_num = 0x0001;
    
    # Data Coding Scheme
    # 0x01 = GSM-7 default alphabet
    data_coding_scheme = 0x01;
    
    # Warning message text (max ~90 chars for GSM-7)
    warning_message = "EARTHQUAKE WARNING - F2G TelcoLab Test. This is a test of the Emergency Alert System. No action required.";
};
