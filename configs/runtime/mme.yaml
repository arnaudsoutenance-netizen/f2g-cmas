logger:
  file:
    path: /tmp/f2g_cmas/mme.log
  level: debug
  domain: mme,sbcap,s1ap

global:
  max:
    ue: 1024

mme:
  freeDiameter: /tmp/f2g_cmas/mme-fd.conf
  
  s1ap:
    server:
      - address: 127.0.0.2        # eNB1 local (PC1)
        port: 36412
      - address: 192.168.1.100    # eNB2 distant (PC2, câble Ethernet)
        port: 36412
  
  sbcap:
    server:
      - address: 127.0.0.2
        port: 29168
  
  gtpc:
    server:
      - address: 172.22.0.1
    client:
      sgwc:
        - address: 172.22.0.5
      smf:
        - address: 172.22.0.7

  gummei:
    - plmn_id:
        mcc: 001
        mnc: 01
      mme_gid: 2
      mme_code: 1

  tai:
    - plmn_id:
        mcc: 001
        mnc: 01
      tac: [1, 2]        # 1 = Yaoundé (eNB1, PC1), 2 = Douala (eNB2, PC2)

  security:
    integrity_order : [ EIA2, EIA1, EIA0 ]
    ciphering_order : [ EEA0, EEA1, EEA2 ]

  network_name:
    full: F2G Lab Network

  mme_name: f2g-mme
