#####################################################################
#  F2G TelcoLab — enb1.conf (eNB1 - PC1 192.168.1.100)
#  S1 Handover Configuration
#  Créé le: 2026-10-01
#####################################################################

[enb]
enb_id = 0x19B
mcc = 001
mnc = 01
mme_addr = 127.0.0.2
gtp_bind_addr = 192.168.1.100
s1c_bind_addr = 127.0.0.2
s1c_bind_port = 0
n_prb = 50

[enb_files]
sib_config = sib.conf
rr_config  = rr1.conf
rb_config  = rb.conf

#####################################################################
# RF configuration — bladeRF
#####################################################################
[rf]
dl_earfcn = 1450
tx_gain = 60
rx_gain = 40

# Pour bladeRF réel:
device_name = bladeRF
# device_args = 

# Pour test ZMQ (simulation):
# device_name = zmq
# device_args = fail_on_disconnect=true,tx_port=tcp://*:2001,rx_port=tcp://localhost:2000,id=enb1,base_srate=23.04e6

#####################################################################
# PCAP for debugging
#####################################################################
[pcap]
enable = false
filename = /tmp/enb1.pcap
s1ap_enable = true
s1ap_filename = /tmp/enb1_s1ap.pcap

#####################################################################
# Logging
#####################################################################
[log]
all_level = info
all_hex_limit = 32
filename = /tmp/enb1.log
file_max_size = -1

[gui]
enable = false
